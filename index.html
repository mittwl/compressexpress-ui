<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CompressExpress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: var(--figma-color-bg, #2c2c2c);
    --bg2: var(--figma-color-bg-secondary, #383838);
    --bg3: var(--figma-color-bg-tertiary, #4a4a4a);
    --border: var(--figma-color-border, #444444);
    --text: var(--figma-color-text, #ffffff);
    --text2: var(--figma-color-text-secondary, #b3b3b3);
    --sel: var(--figma-color-bg-selected, #3a4553);
    --link: var(--figma-color-text-brand, #7cc4ff);
    --ok: var(--figma-color-text-success, #7ee2a8);
    --warn: var(--figma-color-text-warning, #ffcd29);
    --brand: #0b6fd6;
    --brand-hover: #2382e6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 11px/16px Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, select, input { font: inherit; color: inherit; }
  a { color: var(--link); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }

  #app { display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px; border-bottom: 1px solid var(--border); flex: none; }
  header .title { font-weight: 600; }
  .tabs { display: flex; gap: 2px; background: var(--bg2); border-radius: 6px; padding: 2px; }
  .tab { height: 24px; padding: 0 8px; display: flex; align-items: center; gap: 6px; border: none; border-radius: 5px; background: transparent; color: var(--text2); font-weight: 500; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--bg3); color: var(--text); }
  .badge { min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--bg3); color: var(--text); font-size: 10px; line-height: 16px; text-align: center; }
  .tab[aria-selected="true"] .badge { background: var(--bg); }
  .tick { color: var(--ok); display: inline-flex; }

  .panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .panel[hidden] { display: none; }

  .settings { padding: 8px 12px 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; border-bottom: 1px solid var(--border); flex: none; }
  .settings .head { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; min-height: 16px; }
  .settings .head b { font-weight: 600; }
  .settings .head .muted { color: var(--text2); font-weight: 400; }
  .settings .head b.selmode { color: var(--link); }
  .field { display: flex; flex-direction: column; gap: 4px; color: var(--text2); min-width: 0; }
  .ctl { height: 24px; width: 100%; min-width: 0; background: var(--bg2); color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 0 6px; }
  .ctl:disabled { opacity: 0.45; }
  .ctl:focus { outline: 1px solid var(--link); outline-offset: -1px; }
  .kbwrap { display: flex; align-items: center; gap: 6px; color: var(--text2); }
  .check { display: flex; align-items: center; gap: 6px; color: var(--text2); cursor: pointer; }
  .check input { margin: 0; width: 12px; height: 12px; accent-color: #0d99ff; flex: none; }
  .settings .check.bottom { align-self: end; padding-bottom: 4px; }

  .listhead { display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 12px; color: var(--text2); flex: none; }
  .list { flex: 1; overflow-y: auto; min-height: 0; }
  .row { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 4px 12px; user-select: none; }
  .row.editable { cursor: default; }
  .row.editable:hover { background: color-mix(in srgb, var(--bg2) 60%, transparent); }
  .row.sel, .row.sel:hover { background: var(--sel); }
  .row input[type="checkbox"] { margin: 0; width: 12px; height: 12px; accent-color: #0d99ff; flex: none; }
  .row .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 13px; }
  .row .nm .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .nm .d { color: var(--text2); font-size: 10px; }
  .row .dims { color: var(--text2); white-space: nowrap; }
  .mini { height: 22px; background: var(--bg2); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font-size: 10px; }
  .mini.fmt { width: 58px; }
  .mini.kbi { width: 38px; text-align: right; }
  .mini:disabled { opacity: 0.45; }
  .mini.ov { color: var(--link); }
  .row .kb { display: flex; align-items: center; gap: 3px; color: var(--text2); font-size: 10px; }
  .empty { padding: 24px 16px; color: var(--text2); text-align: center; line-height: 18px; }

  .card { margin: 0 12px 8px; padding: 10px 12px; background: var(--bg2); border-radius: 6px; display: flex; flex-direction: column; gap: 4px; flex: none; }
  .card[hidden], .nextbar[hidden] { display: none; }
  .card .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card .okline { display: flex; align-items: center; gap: 6px; color: var(--ok); min-width: 0; }
  .card .okline.warn { color: var(--warn); }
  .card .sum { color: var(--text2); }
  .card .actions { display: flex; align-items: center; gap: 10px; flex: none; }
  .card .details { color: var(--text2); font-size: 10px; line-height: 14px; white-space: pre-wrap; margin-top: 4px; }
  .linkbtn { border: none; background: none; padding: 0; color: var(--link); font-weight: 500; cursor: pointer; }
  .linkbtn:hover { text-decoration: underline; }
  .nextbar { margin: 0 12px 8px; height: 32px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; border: 1px dashed var(--bg3); border-radius: 6px; background: transparent; color: var(--text); cursor: pointer; flex: none; width: calc(100% - 24px); }
  .nextbar:hover { border-color: var(--text2); }
  .nextbar .muted { color: var(--text2); }

  footer { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; flex: none; }
  .status { color: var(--text2); min-height: 16px; }
  .status .hint { font-size: 10px; color: var(--text2); opacity: 0.85; margin-top: 2px; line-height: 14px; }
  .bar { height: 3px; border-radius: 2px; background: var(--bg2); overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: #0d99ff; transition: width 0.2s ease; }
  .bar.busy { background: repeating-linear-gradient(-45deg, var(--bg2) 0 6px, #0d99ff 6px 12px); background-size: 17px 17px; animation: ceBusy 0.8s linear infinite; }
  .bar.busy > div { width: 0 !important; }
  @keyframes ceBusy { from { background-position: 0 0; } to { background-position: 17px 0; } }
  .primary { width: 100%; height: 32px; border: none; border-radius: 6px; background: var(--brand); color: #fff; font-weight: 600; cursor: pointer; }
  .primary:hover:enabled { background: var(--brand-hover); }
  .primary:disabled { opacity: 0.5; cursor: default; }
  .smooth[hidden], .field[hidden] { display: none; }
  .settings.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .settings.three .smooth, .settings.three .wide { grid-column: 1 / -1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="title">CompressExpress</span>
    <div class="tabs" role="tablist" aria-label="Export type">
      <button class="tab" role="tab" id="tabImages" aria-selected="true" aria-controls="panelImages">Images <span class="badge" id="badgeImages">0</span></button>
      <button class="tab" role="tab" id="tabVideo" aria-selected="false" aria-controls="panelVideo">Video <span class="badge" id="badgeVideo">0</span></button>
    </div>
  </header>

  <!-- IMAGES -->
  <section class="panel" id="panelImages" role="tabpanel" aria-labelledby="tabImages">
    <div class="settings three">
      <div class="head"><b id="imgHead">Defaults <span class="muted">· all images</span></b><a id="imgClear" hidden>Clear</a></div>
      <label class="field">Format
        <select class="ctl" id="setFmt"><option value="" hidden>Mixed</option><option>JPG</option><option>PNG</option><option>WEBP</option></select>
      </label>
      <label class="field">Scale
        <select class="ctl" id="setScale"><option value="" hidden>Mixed</option><option value="0.5">0.5x</option><option value="1">1x</option><option value="2">2x</option><option value="3">3x</option></select>
      </label>
      <label class="field" title="Maximum file size per image">Max size
        <span class="kbwrap"><input class="ctl" id="setKb" type="text" inputmode="numeric" value="100">KB</span>
      </label>
      <label class="check wide"><input type="checkbox" id="skipOpt"> Skip optimisation</label>
    </div>
    <div class="listhead"><span id="imgListLabel">Stills in selection</span><label class="check"><input type="checkbox" id="imgAll" checked> All</label></div>
    <div class="list" id="imgList"></div>
    <div class="card" id="imgCard" hidden></div>
    <button class="nextbar" id="imgNext" hidden></button>
    <footer>
      <div class="status" id="imgStatus"></div>
      <div class="bar" id="imgBar" hidden><div></div></div>
      <button class="primary" id="imgBtn" disabled>Export images</button>
    </footer>
  </section>

  <!-- VIDEO -->
  <section class="panel" id="panelVideo" role="tabpanel" aria-labelledby="tabVideo" hidden>
    <div class="settings three">
      <label class="field">Format
        <select class="ctl" id="videoFormat" title="MP4 for screens (rotation-fixed), GIF for banners and email, WebM for web"><option value="MP4" selected>MP4</option><option value="GIF">GIF</option><option value="WEBM">WebM</option></select>
      </label>
      <label class="field">Frame rate
        <select class="ctl" id="videoFps"><option value="60">60fps</option><option value="30">30fps</option><option value="25">25fps</option><option value="24" selected>24fps</option><option value="12">12fps</option></select>
      </label>
      <label class="field" id="loopWrap" hidden>Loop
        <select class="ctl" id="videoLoop" title="How many times the GIF repeats"><option value="0" selected>Forever</option><option value="1">1 time</option><option value="2">2 times</option><option value="3">3 times</option><option value="5">5 times</option></select>
      </label>
      <label class="field" id="qualityWrap">Quality
        <select class="ctl" id="videoQuality" title="Figma render quality and output file size"><option value="LOW">Low</option><option value="MEDIUM" selected>Medium</option><option value="HIGH">High</option></select>
      </label>
      <label class="check smooth" id="smoothWrap" hidden title="Figma can't render 25fps from plugins. Smooth renders at 60fps and converts (about twice as long); otherwise it renders at 30fps and converts."><input type="checkbox" id="videoSmooth"> Smooth 25fps (slower)</label>
    </div>
    <div class="listhead"><span id="vidListLabel">Motion frames in selection</span><label class="check"><input type="checkbox" id="vidAll" checked> All</label></div>
    <div class="list" id="vidList"></div>
    <div class="card" id="vidCard" hidden></div>
    <button class="nextbar" id="vidNext" hidden></button>
    <footer>
      <div class="status" id="vidStatus"></div>
      <div class="bar" id="vidBar" hidden><div></div></div>
      <button class="primary" id="vidBtn" disabled>Export MP4</button>
    </footer>
  </section>
</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pica@8.0.0/dist/pica.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.js"></script>
  <script>
/* Broadsign fix v3
   - Reads rotation + true frame rate (from the media header) with mp4box.js
   - Fast path: WebCodecs (hardware/native encoder) when the page is a secure context, e.g. hosted on GitHub Pages
   - Fallback: ffmpeg.wasm (works in Figma's sandbox, slower)
   - Bakes rotation into the pixels and converts to the requested frame rate when needed
   fixForBroadsign(u8, onProgress, onStatus, targetFps) -> { bytes, fixed, retimed, fps, engine, note } */
(function (global) {
  var FFMPEG_CORE = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js';
  var progressCb = null, engineLoadedOnce = false, lastMode = '';
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  // ---------- inspect ----------
  function inspect(u8) {
    return new Promise(function (resolve, reject) {
      var file = MP4Box.createFile(), ready = false, track = null, samples = [];
      file.onError = function (e) { reject(new Error('Could not read MP4: ' + e)); };
      file.onReady = function (info) {
        ready = true;
        track = info.videoTracks[0];
        if (!track) return;
        file.setExtractionOptions(track.id, null, { nbSamples: Infinity });
        file.start();
      };
      file.onSamples = function (id, user, s) { samples = samples.concat(s); };
      var ab = u8.buffer.slice(u8.byteOffset, u8.byteOffset + u8.byteLength);
      ab.fileStart = 0;
      file.appendBuffer(ab);
      file.flush();
      if (!ready) { reject(new Error('MP4 not readable (no moov box)')); return; }
      if (!track) { reject(new Error('No video track found')); return; }
      var trak = file.getTrackById(track.id);
      var mdhd = trak.mdia.mdhd;
      var secs = mdhd.duration / mdhd.timescale;          // media timescale, not movie timescale
      if (!(secs > 0) && samples.length) {
        secs = samples.reduce(function (a, s) { return a + s.duration / s.timescale; }, 0);
      }
      var entry = trak.mdia.minf.stbl.stsd.entries[0];
      var box = entry.avcC || entry.hvcC, desc;
      if (box) {
        var st = new DataStream(undefined, 0, DataStream.BIG_ENDIAN);
        box.write(st);
        desc = new Uint8Array(st.buffer, 8);
      }
      var m = track.matrix;
      resolve({
        track: track, samples: samples, description: desc,
        M: { a: m[0] / 65536, b: m[1] / 65536, c: m[3] / 65536, d: m[4] / 65536 },
        identity: m[0] === 65536 && m[1] === 0 && m[3] === 0 && m[4] === 65536,
        width: track.video.width, height: track.video.height,
        fps: secs > 0 ? track.nb_samples / secs : 0, seconds: secs
      });
    });
  }

  // ---------- fast path: WebCodecs ----------
  function canUseWebCodecs() {
    return !!(global.isSecureContext && typeof VideoEncoder !== 'undefined' &&
              typeof VideoDecoder !== 'undefined' && typeof OffscreenCanvas !== 'undefined' && global.Mp4Muxer);
  }

  // Output bitrate per quality (bits per pixel per frame), capped at 25 Mbps
  var QUALITY_BPP = { LOW: 0.035, MEDIUM: 0.06, HIGH: 0.1 };
  var QUALITY_CRF = { LOW: 26, MEDIUM: 22, HIGH: 18 };
  var currentQuality = 'MEDIUM';
  async function pickEncoderConfig(w, h, fps) {
    var bitrate = Math.min(25000000, Math.round(w * h * fps * (QUALITY_BPP[currentQuality] || 0.06)));
    var codecs = ['avc1.640034', 'avc1.640033', 'avc1.4d0034', 'avc1.420034'];
    var accel = ['prefer-hardware', 'no-preference', 'prefer-software'];
    for (var i = 0; i < accel.length; i++) for (var j = 0; j < codecs.length; j++) {
      var cfg = { codec: codecs[j], width: w, height: h, bitrate: bitrate, framerate: fps,
                  hardwareAcceleration: accel[i], avc: { format: 'avc' } };
      try { if ((await VideoEncoder.isConfigSupported(cfg)).supported) return cfg; } catch (e) {}
    }
    return null;
  }

  function canvasToI420Frame(ctx, w, h, timestamp, duration) {
    var px = ctx.getImageData(0, 0, w, h).data;
    var ySize = w * h, cw = w >> 1, ch = h >> 1, cSize = cw * ch;
    var buf = new Uint8Array(ySize + 2 * cSize);
    var Y = buf.subarray(0, ySize), U = buf.subarray(ySize, ySize + cSize), V = buf.subarray(ySize + cSize);
    var i, x, y, r, g, b;
    for (i = 0, y = 0; y < h; y++) for (x = 0; x < w; x++, i += 4)
      Y[y * w + x] = (16 + 0.18259 * px[i] + 0.61423 * px[i + 1] + 0.06201 * px[i + 2]) + 0.5 | 0;
    for (y = 0; y < ch; y++) for (x = 0; x < cw; x++) {
      var o = ((y * 2) * w + x * 2) * 4, o2 = o + w * 4;
      r = (px[o] + px[o + 4] + px[o2] + px[o2 + 4]) / 4;
      g = (px[o + 1] + px[o + 5] + px[o2 + 1] + px[o2 + 5]) / 4;
      b = (px[o + 2] + px[o + 6] + px[o2 + 2] + px[o2 + 6]) / 4;
      U[y * cw + x] = (128 - 0.10064 * r - 0.33857 * g + 0.43922 * b) + 0.5 | 0;
      V[y * cw + x] = (128 + 0.43922 * r - 0.39894 * g - 0.04027 * b) + 0.5 | 0;
    }
    return new VideoFrame(buf, { format: 'I420', codedWidth: w, codedHeight: h, timestamp: timestamp,
      duration: duration, colorSpace: { primaries: 'bt709', transfer: 'bt709', matrix: 'bt709', fullRange: false } });
  }

  async function runWebCodecs(info, outFps, onProgress) {
    var t = info.track, M = info.M, W = info.width, H = info.height;
    var corners = [[0, 0], [W, 0], [0, H], [W, H]].map(function (p) { return [M.a * p[0] + M.c * p[1], M.b * p[0] + M.d * p[1]]; });
    var xs = corners.map(function (p) { return p[0]; }), ys = corners.map(function (p) { return p[1]; });
    var minX = Math.min.apply(null, xs), minY = Math.min.apply(null, ys);
    var outW = 2 * Math.round(0.5 * (Math.max.apply(null, xs) - minX));
    var outH = 2 * Math.round(0.5 * (Math.max.apply(null, ys) - minY));

    var encCfg = await pickEncoderConfig(outW, outH, outFps);
    if (!encCfg) return null; // let caller fall back
    // Hardware encoders (VideoToolbox on Mac) convert RGB to broadcast-range YUV on the GPU themselves,
    // so hand them the canvas directly. Software encoders can tag full range, so convert in JS for those.
    var direct = encCfg.hardwareAcceleration === 'prefer-hardware' && !global.__forceI420;
    if (global.__forceDirect) direct = true;

    var target = new Mp4Muxer.ArrayBufferTarget();
    var muxer = new Mp4Muxer.Muxer({ target: target, video: { codec: 'avc', width: outW, height: outH, frameRate: outFps }, fastStart: 'in-memory' });
    var canvas = new OffscreenCanvas(outW, outH);
    var ctx = canvas.getContext('2d', { willReadFrequently: !direct });
    var encErr = null, decErr = null, outCount = 0;
    var step = 1e6 / outFps, nextT = 0, endT = info.seconds * 1e6;
    var totalOut = Math.round(info.seconds * outFps);

    var encoder = new VideoEncoder({ output: function (c, m) { muxer.addVideoChunk(c, m); }, error: function (e) { encErr = e; } });
    encoder.configure(encCfg);
    var decoder = new VideoDecoder({
      output: function (frame) {
        var ts = frame.timestamp, d = frame.duration || (1e6 / (info.fps || 25));
        if (nextT < ts + d && nextT < endT - 1) {
          ctx.setTransform(M.a, M.b, M.c, M.d, -minX, -minY);
          ctx.drawImage(frame, 0, 0, W, H);
          // emit as many output frames as fall inside this source frame (drops or duplicates to hit outFps)
          while (nextT < ts + d && nextT < endT - 1) {
            var vf = direct
              ? new VideoFrame(canvas, { timestamp: Math.round(nextT), duration: Math.round(step) })
              : canvasToI420Frame(ctx, outW, outH, Math.round(nextT), Math.round(step));
            encoder.encode(vf, { keyFrame: outCount % (outFps * 2) === 0 });
            vf.close();
            outCount++; nextT = outCount * step;
          }
          if (onProgress) onProgress(Math.min(1, outCount / totalOut));
        }
        frame.close();
      },
      error: function (e) { decErr = e; }
    });
    var decCfg = { codec: t.codec, codedWidth: W, codedHeight: H };
    if (info.description) decCfg.description = info.description;
    decoder.configure(decCfg);

    for (var i = 0; i < info.samples.length; i++) {
      var s = info.samples[i];
      decoder.decode(new EncodedVideoChunk({ type: s.is_sync ? 'key' : 'delta',
        timestamp: Math.round(s.cts * 1e6 / s.timescale), duration: Math.round(s.duration * 1e6 / s.timescale), data: s.data }));
      while ((decoder.decodeQueueSize > 4 || encoder.encodeQueueSize > 4) && !encErr && !decErr) await sleep(2);
      if (encErr || decErr) break;
    }
    if (!encErr && !decErr) { await decoder.flush(); await encoder.flush(); }
    decoder.close(); encoder.close();
    if (decErr) throw new Error('Decode failed: ' + decErr.message);
    if (encErr) throw new Error('Encode failed: ' + encErr.message);
    if (!outCount) throw new Error('No frames were decoded');
    muxer.finalize();
    lastMode = direct ? 'direct' : 'i420';
    return new Uint8Array(target.buffer);
  }

  // ---------- fallback: ffmpeg.wasm ----------
  async function runFFmpeg(u8, info, outFps, fpsOff, onProgress, onStatus) {
    if (onStatus) onStatus(engineLoadedOnce ? 'Starting video engine…' : 'Loading video engine (first time only, ~25MB)…');
    var ff = FFmpeg.createFFmpeg({ corePath: FFMPEG_CORE, mainName: 'main', log: false });
    ff.setProgress(function (p) { if (progressCb && p && p.ratio >= 0) progressCb(Math.min(1, p.ratio)); });
    await ff.load();
    engineLoadedOnce = true;
    progressCb = onProgress || null;
    if (onStatus) onStatus('Processing in compatibility mode… this can take a couple of minutes');
    await sleep(50);
    ff.FS('writeFile', 'in.mp4', u8);
    try {
      var args = ['-i', 'in.mp4', '-map', '0:v:0'];
      if (fpsOff) args.push('-vf', 'fps=' + outFps);
      args.push('-c:v', 'libx264', '-preset', 'ultrafast', '-crf', String(QUALITY_CRF[currentQuality] || 22), '-pix_fmt', 'yuv420p',
        '-color_primaries', 'bt709', '-color_trc', 'bt709', '-colorspace', 'bt709',
        '-movflags', '+faststart', '-metadata:s:v:0', 'rotate=0', 'out.mp4');
      await ff.run.apply(ff, args);
      var out = ff.FS('readFile', 'out.mp4');
      if (!out || !out.length) throw new Error('ffmpeg produced no output');
      return out;
    } finally {
      try { ff.exit(); } catch (e) {}
      progressCb = null;

      const failRender = vLogs.filter((r) => !r.ok);
      const fixTotal = vOut.reduce((a, v) => a + (v.fixMs || 0), 0);
      const engines = [...new Set(vOut.map((v) => v.engine).filter((e) => e && e !== 'none'))];
      const modes = [...new Set(vOut.map((v) => v.mode).filter((m) => m && m !== 'none'))];
      const lines = [];
      if (vFormat === 'MP4') lines.push(`${n} exported, ${fixed} rotation-fixed${retimed ? `, ${retimed} frame-rate converted` : ''}.`);
      else lines.push(`${n} ${FI.label} exported straight from Figma (no rotation fix needed).`);
      if (vRenderFps && vRenderFps !== vTargetFps) lines.push(`Figma rendered at ${vRenderFps}fps (plugins can't render ${vTargetFps}fps), converted to ${vTargetFps}fps${vRenderFps === 60 ? ' (smooth)' : ''}.`);
      if (vSetting) lines.push(`Figma setting: ${vSetting}`);
      if (engines.length) lines.push(`Engine: ${engines.map((e) => (e === 'webcodecs' ? 'fast (WebCodecs)' : 'compatibility (ffmpeg)')).join(', ')}${modes.length ? ' [' + modes.join(', ') + ']' : ''}`);
      let timing = `Timing: Figma render ${s(okRender)}`;
      if (failRender.length) timing += ` + ${s(failRender.reduce((a, r) => a + r.ms, 0))} on rejected settings`;
      lines.push(timing + (vFormat === 'MP4' ? `, fix ${s(fixTotal)}` : ''));
      if (failed) lines.push('Failed: ' + vErrors.join(' | '));
      console.log('[CompressExpress] video export details\n' + lines.join('\n'));

      const total = vOut.reduce((a, v) => a + v.bytes.length, 0);
      const headline = n ? `${plural(n, FI.label)} ready for export${failed ? `, ${failed} failed` : ''}` : `Export failed${failed ? ': ' + vErrors[0] : ''}`;
      busy = false; done.video = n > 0;
      $('vidBar').hidden = true; $('vidStatus').textContent = '';
      showCard($('vidCard'), {
        ok: n > 0 && !failed, headline,
        summary: n ? `${n === 1 ? filename + ' · ' : ''}${vTargetFps}fps · ${vFormat === 'GIF' ? (vLoop ? `loops ${vLoop}×` : 'loops forever') : vTargetQ.toLowerCase()} · ${mb(total)} · ${s(okRender + fixTotal)}` : '',
        blob, filename, details: lines.join('\n')
      });
      toFigma({ type: 'video-finished', message: n ? `${headline} (if nothing downloaded, click Download in CompressExpress)` : headline, error: !(n && !failed) });
      renderAll();
    }

    // ---------- messages from Figma ----------
    window.onmessage = ({ data: { pluginMessage: msg } = {} }) => {
      if (!msg) return;
      if (msg.type === 'set-image-list') {
        items = msg.data.images || [];
        projectName = msg.data.projectName || projectName;
        const ids = new Set(items.map((i) => i.id));
        sel = new Set([...sel].filter((id) => ids.has(id)));
        // land on the tab that has something; prefer Video when the selection contains Motion frames
        const s = stills().length, m = motions().length;
        if (!tab) setTab(m ? 'video' : 'images');
        else if (tab === 'images' && !s && m) setTab('video');
        else if (tab === 'video' && !m && s) setTab('images');
        if (!busy) { $('imgCard').hidden = true; $('vidCard').hidden = true; done.images = false; done.video = false; }
        renderAll();
      }
      if (msg.type === 'export-result') {
        imgResults.push(msg.data);
        $('imgBar').firstElementChild.style.width = `${Math.round(50 * imgResults.length / Math.max(1, imgChosen.length))}%`;
        $('imgStatus').textContent = `Exported ${imgResults.length} of ${imgChosen.length} from Figma…`;
      }
      if (msg.type === 'export-error') imgErrors.push(`${msg.data.name}: ${msg.data.message}`);
      if (msg.type === 'export-complete') finishImages();

      if (msg.type === 'video-status') {
        vRendered++;
        const rName = msg.data.name, rIdx = Math.min(vRendered, vTotal), rStart = Date.now();
        const counter = vTotal > 1 ? ` (${rIdx} of ${vTotal})` : '';
        stopRenderTimer();
        $('vidBar').hidden = false; $('vidBar').classList.add('busy');
        const tick = () => {
          $('vidStatus').textContent = `Rendering ${rName} in Figma${counter}… ${Math.round((Date.now() - rStart) / 1000)}s`;
          const hint = document.createElement('div'); hint.className = 'hint';
          hint.textContent = "If Figma's export window opens, close it (don't use its Download). Your file saves when you're back.";
          $('vidStatus').appendChild(hint);
        };
        tick(); renderTimer = setInterval(tick, 1000);
      }
      if (msg.type === 'video-error') { stopRenderTimer(); vErrors.push(`${msg.data.name}: ${msg.data.message}`); }
      if (msg.type === 'video-result') {
        stopRenderTimer();
        const { id, name, bytes, used, settingErrors, fps, renderFps, renderLog } = msg.data;
        if (renderFps) vRenderFps = renderFps;
        if (renderLog) vLogs.push(...renderLog);
        if (used) vSetting = used;
        if (settingErrors && settingErrors.length) console.log('[CompressExpress] Figma export setting errors', settingErrors);
        vQueue = vQueue.then(async () => {
          if (vFormat !== 'MP4') {
            vOut.push({ id, name, bytes: new Uint8Array(bytes), fixed: false, retimed: false, engine: 'none', mode: 'none', fixMs: 0 });
            $('vidBar').firstElementChild.style.width = `${Math.round(100 * (vOut.length + vErrors.length) / vTotal)}%`;
            return;
          }
          try {
            const r = await fixForBroadsign(new Uint8Array(bytes),
              (p) => { $('vidStatus').textContent = `Fixing ${name}… ${Math.round(p * 100)}%`; $('vidBar').firstElementChild.style.width = `${Math.round(100 * (vOut.length + vErrors.length + p) / vTotal)}%`; },
              (st) => { $('vidStatus').textContent = `${name}: ${st}`; },
              fps, vTargetQ);
            vOut.push({ id, name, bytes: r.bytes, fixed: r.fixed, retimed: r.retimed, engine: r.engine, mode: r.mode, fixMs: r.fixMs });
          } catch (e) { vErrors.push(`${name}: ${e.message}`); }
          $('vidBar').firstElementChild.style.width = `${Math.round(100 * (vOut.length + vErrors.length) / vTotal)}%`;
        });
      }
      if (msg.type === 'video-complete') vQueue = vQueue.then(finalizeVideo);
    };

    syncFormat();
    renderAll();
    window.addEventListener('load', () => toFigma({ type: 'get-images' }));
  })();
  </script>
</body>
</html>
