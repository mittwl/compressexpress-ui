<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CompressExpress Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: var(--figma-color-bg, #2c2c2c);
    --bg2: var(--figma-color-bg-secondary, #383838);
    --bg3: var(--figma-color-bg-tertiary, #4a4a4a);
    --border: var(--figma-color-border, #444444);
    --text: var(--figma-color-text, #ffffff);
    --text2: var(--figma-color-text-secondary, #b3b3b3);
    --sel: var(--figma-color-bg-selected, #3a4553);
    --link: var(--figma-color-text-brand, #7cc4ff);
    --ok: var(--figma-color-text-success, #7ee2a8);
    --warn: var(--figma-color-text-warning, #ffcd29);
    --brand: #0b6fd6;
    --brand-hover: #2382e6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 11px/16px Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, select, input { font: inherit; color: inherit; }
  a { color: var(--link); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }

  #app { display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px; border-bottom: 1px solid var(--border); flex: none; }
  header .title { font-weight: 600; }
  .tabs { display: flex; gap: 2px; background: var(--bg2); border-radius: 6px; padding: 2px; }
  .tab { height: 24px; padding: 0 8px; display: flex; align-items: center; gap: 6px; border: none; border-radius: 5px; background: transparent; color: var(--text2); font-weight: 500; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--bg3); color: var(--text); }
  .badge { min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--bg3); color: var(--text); font-size: 10px; line-height: 16px; text-align: center; }
  .tab[aria-selected="true"] .badge { background: var(--bg); }
  .tick { color: var(--ok); display: inline-flex; }

  .panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .panel[hidden] { display: none; }

  .settings { padding: 8px 12px 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; border-bottom: 1px solid var(--border); flex: none; }
  .settings .head { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; min-height: 16px; }
  .settings .head b { font-weight: 600; }
  .settings .head .muted { color: var(--text2); font-weight: 400; }
  .settings .head b.selmode { color: var(--link); }
  .field { display: flex; flex-direction: column; gap: 4px; color: var(--text2); min-width: 0; }
  .ctl { height: 24px; width: 100%; min-width: 0; background: var(--bg2); color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 0 6px; }
  .ctl:disabled { opacity: 0.45; }
  .ctl:focus { outline: 1px solid var(--link); outline-offset: -1px; }
  .kbwrap { display: flex; align-items: center; gap: 6px; color: var(--text2); }
  .check { display: flex; align-items: center; gap: 6px; color: var(--text2); cursor: pointer; }
  .check input { margin: 0; width: 12px; height: 12px; accent-color: #0d99ff; flex: none; }
  .settings .check.bottom { align-self: end; padding-bottom: 4px; }

  .listhead { display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 12px; color: var(--text2); flex: none; }
  .list { flex: 1; overflow-y: auto; min-height: 0; }
  .row { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 4px 12px; user-select: none; }
  .row.editable { cursor: default; }
  .row.editable:hover { background: color-mix(in srgb, var(--bg2) 60%, transparent); }
  .row.sel, .row.sel:hover { background: var(--sel); }
  .row input[type="checkbox"] { margin: 0; width: 12px; height: 12px; accent-color: #0d99ff; flex: none; }
  .row .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 13px; }
  .row .nm .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .nm .d { color: var(--text2); font-size: 10px; }
  .row .dims { color: var(--text2); white-space: nowrap; }
  .mini { height: 22px; background: var(--bg2); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font-size: 10px; }
  .mini.fmt { width: 58px; }
  .mini.kbi { width: 38px; text-align: right; }
  .mini:disabled { opacity: 0.45; }
  .mini.ov { color: var(--link); }
  .row .kb { display: flex; align-items: center; gap: 3px; color: var(--text2); font-size: 10px; }
  .empty { padding: 24px 16px; color: var(--text2); text-align: center; line-height: 18px; }

  .card { margin: 0 12px 8px; padding: 10px 12px; background: var(--bg2); border-radius: 6px; display: flex; flex-direction: column; gap: 4px; flex: none; }
  .card[hidden], .nextbar[hidden] { display: none; }
  .card .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card .okline { display: flex; align-items: center; gap: 6px; color: var(--ok); min-width: 0; }
  .card .okline.warn { color: var(--warn); }
  .card .sum { color: var(--text2); }
  .card .actions { display: flex; align-items: center; gap: 10px; flex: none; }
  .card .details { color: var(--text2); font-size: 10px; line-height: 14px; white-space: pre-wrap; margin-top: 4px; max-height: 112px; overflow-y: auto; }
  .linkbtn { border: none; background: none; padding: 0; color: var(--link); font-weight: 500; cursor: pointer; }
  .linkbtn:hover { text-decoration: underline; }
  .nextbar { margin: 0 12px 8px; height: 32px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; border: 1px dashed var(--bg3); border-radius: 6px; background: transparent; color: var(--text); cursor: pointer; flex: none; width: calc(100% - 24px); }
  .nextbar:hover { border-color: var(--text2); }
  .nextbar .muted { color: var(--text2); }

  footer { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; flex: none; }
  .status { color: var(--text2); min-height: 16px; }
  .status .hint { font-size: 10px; color: var(--text2); opacity: 0.85; margin-top: 2px; line-height: 14px; }
  .bar { height: 3px; border-radius: 2px; background: var(--bg2); overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: #0d99ff; transition: width 0.2s ease; }
  .bar.busy { background: repeating-linear-gradient(-45deg, var(--bg2) 0 6px, #0d99ff 6px 12px); background-size: 17px 17px; animation: ceBusy 0.8s linear infinite; }
  .bar.busy > div { width: 0 !important; }
  @keyframes ceBusy { from { background-position: 0 0; } to { background-position: 17px 0; } }
  .primary { width: 100%; height: 32px; border: none; border-radius: 6px; background: var(--brand); color: #fff; font-weight: 600; cursor: pointer; }
  .primary:hover:enabled { background: var(--brand-hover); }
  .primary:disabled { opacity: 0.5; cursor: default; }
  .btnrow { display: flex; gap: 8px; }
  .btnrow .primary { flex: 1; min-width: 0; }
  .secondary { flex: none; height: 32px; padding: 0 12px; border: 1px solid var(--bg3); border-radius: 6px; background: transparent; color: var(--text); font-weight: 600; cursor: pointer; white-space: nowrap; }
  .secondary:hover:enabled { border-color: var(--text2); }
  .secondary:disabled { opacity: 0.5; cursor: default; }
  .secondary[hidden] { display: none; }
  .smooth[hidden], .field[hidden] { display: none; }
  .settings.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .settings.three .smooth, .settings.three .wide { grid-column: 1 / -1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="title">CompressExpress Motion</span>
    <div class="tabs" role="tablist" aria-label="Export type">
      <button class="tab" role="tab" id="tabImages" aria-selected="true" aria-controls="panelImages">Stills <span class="badge" id="badgeImages">0</span></button>
      <button class="tab" role="tab" id="tabVideo" aria-selected="false" aria-controls="panelVideo">Motion <span class="badge" id="badgeVideo">0</span></button>
    </div>
  </header>

  <!-- IMAGES -->
  <section class="panel" id="panelImages" role="tabpanel" aria-labelledby="tabImages">
    <div class="settings three">
      <div class="head"><b id="imgHead">Defaults <span class="muted">· all images</span></b><a id="imgClear" hidden>Clear</a></div>
      <label class="field">Format
        <select class="ctl" id="setFmt"><option value="" hidden>Mixed</option><option>JPG</option><option>PNG</option><option>WEBP</option></select>
      </label>
      <label class="field">Scale
        <select class="ctl" id="setScale"><option value="" hidden>Mixed</option><option value="0.5">0.5x</option><option value="1">1x</option><option value="2">2x</option><option value="3">3x</option></select>
      </label>
      <label class="field" title="Maximum file size per image">Max size
        <span class="kbwrap"><input class="ctl" id="setKb" type="text" inputmode="numeric" value="100">KB</span>
      </label>
      <label class="check wide"><input type="checkbox" id="skipOpt"> Skip optimisation</label>
    </div>
    <div class="listhead"><span id="imgListLabel">Stills in selection</span><label class="check"><input type="checkbox" id="imgAll" checked> All</label></div>
    <div class="list" id="imgList"></div>
    <div class="card" id="imgCard" hidden></div>
    <button class="nextbar" id="imgNext" hidden></button>
    <footer>
      <div class="status" id="imgStatus"></div>
      <div class="bar" id="imgBar" hidden><div></div></div>
      <div class="btnrow"><button class="primary" id="imgBtn" disabled>Export images</button><button class="secondary allbtn" hidden>Export all</button></div>
    </footer>
  </section>

  <!-- VIDEO -->
  <section class="panel" id="panelVideo" role="tabpanel" aria-labelledby="tabVideo" hidden>
    <div class="settings three">
      <label class="field">Format
        <select class="ctl" id="videoFormat" title="MP4 for screens (rotation-fixed), GIF for banners and email, WebM for web"><option value="MP4" selected>MP4</option><option value="GIF">GIF</option><option value="WEBM">WebM</option></select>
      </label>
      <label class="field">Frame rate
        <select class="ctl" id="videoFps"><option value="60">60fps</option><option value="30">30fps</option><option value="25">25fps</option><option value="24" selected>24fps</option><option value="12">12fps</option></select>
      </label>
      <label class="field" id="loopWrap" hidden>Loop
        <select class="ctl" id="videoLoop" title="How many times the GIF repeats"><option value="0" selected>Forever</option><option value="1">1 time</option><option value="2">2 times</option><option value="3">3 times</option><option value="5">5 times</option></select>
      </label>
      <label class="field" id="qualityWrap">Quality
        <select class="ctl" id="videoQuality" title="Figma render quality and output file size"><option value="LOW">Low</option><option value="MEDIUM" selected>Medium</option><option value="HIGH">High</option></select>
      </label>
      <label class="check smooth" id="smoothWrap" hidden title="Figma can't render 25fps from plugins. Smooth renders at 60fps and converts (about twice as long); otherwise it renders at 30fps and converts."><input type="checkbox" id="videoSmooth"> Smooth 25fps (slower)</label>
    </div>
    <div class="listhead"><span id="vidListLabel">Motion frames in selection</span><label class="check"><input type="checkbox" id="vidAll" checked> All</label></div>
    <div class="list" id="vidList"></div>
    <div class="card" id="vidCard" hidden></div>
    <button class="nextbar" id="vidNext" hidden></button>
    <footer>
      <div class="status" id="vidStatus"></div>
      <div class="bar" id="vidBar" hidden><div></div></div>
      <div class="btnrow"><button class="primary" id="vidBtn" disabled>Export MP4</button><button class="secondary allbtn" hidden>Export all</button></div>
    </footer>
  </section>
</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.js"></script>
  <script id="ce-still-encoder">
/* Stills encoder pool: MozJPEG (@jsquash/jpeg@1.6.0) + libwebp (@jsquash/webp@1.5.0)
   Runs in a 2-worker Blob pool using pinned cdn.jsdelivr.net URLs in both hosted and built-in modes. */
(function (global) {
  const POOL_SIZE = 2;
  const MOZ_JS = 'https://cdn.jsdelivr.net/npm/@jsquash/jpeg@1.6.0/codec/enc/mozjpeg_enc.js';
  const MOZ_WASM = 'https://cdn.jsdelivr.net/npm/@jsquash/jpeg@1.6.0/codec/enc/mozjpeg_enc.wasm';
  const WEBP_SIMD_JS = 'https://cdn.jsdelivr.net/npm/@jsquash/webp@1.5.0/codec/enc/webp_enc_simd.js';
  const WEBP_SIMD_WASM = 'https://cdn.jsdelivr.net/npm/@jsquash/webp@1.5.0/codec/enc/webp_enc_simd.wasm';
  const WEBP_JS = 'https://cdn.jsdelivr.net/npm/@jsquash/webp@1.5.0/codec/enc/webp_enc.js';
  const WEBP_WASM = 'https://cdn.jsdelivr.net/npm/@jsquash/webp@1.5.0/codec/enc/webp_enc.wasm';

  function detectSimd() {
    try {
      return WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 0, 1, 123, 3, 2, 1, 0, 10, 10, 1, 8, 0, 65, 0, 253, 15, 253, 98, 11]));
    } catch (e) { return false; }
  }
  const USE_SIMD = detectSimd();

  const wasmCache = {};
  function fetchWasmOnce(url) {
    if (!wasmCache[url]) {
      wasmCache[url] = fetch(url).then((r) => {
        if (!r.ok) throw new Error('Could not load encoder WASM (' + r.status + ')');
        return r.arrayBuffer();
      }).catch((err) => { delete wasmCache[url]; throw err; });
    }
    return wasmCache[url];
  }

  function codecSpec(fmt) {
    if (fmt === 'JPG') return { jsUrl: MOZ_JS, wasmUrl: MOZ_WASM };
    if (fmt === 'WEBP') return USE_SIMD ? { jsUrl: WEBP_SIMD_JS, wasmUrl: WEBP_SIMD_WASM } : { jsUrl: WEBP_JS, wasmUrl: WEBP_WASM };
    throw new Error('Unsupported worker format: ' + fmt);
  }

  const WORKER_CODE = `
    const mods = {};
    const MOZ_BASE = {
      quality: 75, baseline: true, arithmetic: false, progressive: false, optimize_coding: true,
      smoothing: 0, color_space: 3, quant_table: 3, trellis_multipass: false, trellis_opt_zero: false,
      trellis_opt_table: false, trellis_loops: 1, auto_subsample: false, chroma_subsample: 2,
      separate_chroma_quality: false, chroma_quality: 75
    };
    const WEBP_BASE = {
      quality: 75, target_size: 0, target_PSNR: 0, method: 6, sns_strength: 50, filter_strength: 60,
      filter_sharpness: 0, filter_type: 1, partitions: 0, segments: 4, pass: 1, show_compressed: 0,
      preprocessing: 0, autofilter: 0, partition_limit: 0, alpha_compression: 1, alpha_filtering: 1,
      alpha_quality: 100, lossless: 0, exact: 0, image_hint: 0, emulate_jpeg_size: 0, thread_level: 0,
      low_memory: 0, near_lossless: 100, use_delta_palette: 0, use_sharp_yuv: 1
    };

    function ensureMod(fmt, jsUrl, wasmBuf) {
      if (!mods[fmt]) {
        mods[fmt] = (async () => {
          const factory = (await import(jsUrl)).default;
          return await factory({ noInitialRun: true, wasmBinary: wasmBuf });
        })().catch((err) => { delete mods[fmt]; throw err; });
      }
      return mods[fmt];
    }

    function flattenOntoWhite(rgba) {
      let hasAlpha = false;
      for (let i = 3; i < rgba.length; i += 4) {
        if (rgba[i] < 255) { hasAlpha = true; break; }
      }
      if (!hasAlpha) return rgba;
      const out = new Uint8Array(rgba.length);
      for (let i = 0; i < rgba.length; i += 4) {
        const a = rgba[i + 3];
        if (a === 255) {
          out[i] = rgba[i]; out[i + 1] = rgba[i + 1]; out[i + 2] = rgba[i + 2]; out[i + 3] = 255;
        } else if (a === 0) {
          out[i] = 255; out[i + 1] = 255; out[i + 2] = 255; out[i + 3] = 255;
        } else {
          const inv = 255 - a;
          out[i]     = (rgba[i]     * a + 255 * inv + 127) / 255 | 0;
          out[i + 1] = (rgba[i + 1] * a + 255 * inv + 127) / 255 | 0;
          out[i + 2] = (rgba[i + 2] * a + 255 * inv + 127) / 255 | 0;
          out[i + 3] = 255;
        }
      }
      return out;
    }

    async function decodePngInWorker(pngBuf, paintWhite) {
      const bmp = await createImageBitmap(new Blob([pngBuf], { type: 'image/png' }));
      const width = bmp.width, height = bmp.height;
      const oc = new OffscreenCanvas(width, height);
      const ctx = oc.getContext('2d', { willReadFrequently: true, colorSpace: 'srgb' });
      if (paintWhite) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);
      }
      ctx.drawImage(bmp, 0, 0);
      bmp.close();
      return { rgba: ctx.getImageData(0, 0, width, height).data, width, height };
    }

    self.onmessage = async (ev) => {
      const { jobId, fmt, kb, skip, jsUrl, wasmBuf, pngBuf, rgbaBuf, width: inW, height: inH } = ev.data;
      try {
        const mod = await ensureMod(fmt, jsUrl, wasmBuf);
        let pixels, width, height;
        if (pngBuf) {
          const dec = await decodePngInWorker(pngBuf, fmt === 'JPG');
          pixels = fmt === 'JPG' ? flattenOntoWhite(dec.rgba) : dec.rgba;
          width = dec.width; height = dec.height;
        } else {
          const raw = new Uint8Array(rgbaBuf);
          pixels = fmt === 'JPG' ? flattenOntoWhite(raw) : raw;
          width = inW; height = inH;
        }

        const stepProg = (step, est) => self.postMessage({ jobId, type: 'progress', p: Math.min(0.95, step / est) });

        if (skip) {
          stepProg(1, 2);
          const view = fmt === 'JPG'
            ? mod.encode(pixels, width, height, Object.assign({}, MOZ_BASE, { quality: 92, chroma_subsample: 1 }))
            : mod.encode(pixels, width, height, Object.assign({}, WEBP_BASE, { quality: 92 }));
          if (!view) throw new Error('Encoding failed');
          const out = new Uint8Array(view);
          self.postMessage({ jobId, type: 'done', fit: true, bytes: out.buffer, q: 92, chroma: fmt === 'JPG' ? '444' : '420', steps: 1, width, height }, [out.buffer]);
          return;
        }

        const maxBytes = Math.floor(kb * 1000);
        let steps = 0;

        if (fmt === 'JPG') {
          // Rule: try 4:4:4 first; if q >= 80 fits, binary-search 80..100 in 4:4:4; else binary-search 1..100 in 4:2:0.
          const v80 = mod.encode(pixels, width, height, Object.assign({}, MOZ_BASE, { quality: 80, chroma_subsample: 1 }));
          steps++; stepProg(steps, 8);
          if (v80 && v80.byteLength <= maxBytes) {
            let best = new Uint8Array(v80), bestQ = 80, lo = 81, hi = 100;
            while (lo <= hi) {
              const q = (lo + hi) >> 1;
              const v = mod.encode(pixels, width, height, Object.assign({}, MOZ_BASE, { quality: q, chroma_subsample: 1 }));
              steps++; stepProg(steps, 7);
              if (v && v.byteLength <= maxBytes) { best = new Uint8Array(v); bestQ = q; lo = q + 1; }
              else hi = q - 1;
            }
            self.postMessage({ jobId, type: 'done', fit: true, bytes: best.buffer, q: bestQ, chroma: '444', steps, width, height }, [best.buffer]);
            return;
          }
          let best = null, bestQ = null, minBytes = Infinity, lo = 1, hi = 100;
          while (lo <= hi) {
            const q = (lo + hi) >> 1;
            const v = mod.encode(pixels, width, height, Object.assign({}, MOZ_BASE, { quality: q, chroma_subsample: 2 }));
            steps++; stepProg(steps, 9);
            if (v && v.byteLength < minBytes) minBytes = v.byteLength;
            if (v && v.byteLength <= maxBytes) { best = new Uint8Array(v); bestQ = q; lo = q + 1; }
            else hi = q - 1;
          }
          if (!best) {
            self.postMessage({ jobId, type: 'done', fit: false, smallestBytes: minBytes, smallestKB: Math.ceil(minBytes / 1000), chroma: '420', steps, width, height });
            return;
          }
          self.postMessage({ jobId, type: 'done', fit: true, bytes: best.buffer, q: bestQ, chroma: '420', steps, width, height }, [best.buffer]);
          return;
        }

        if (fmt === 'WEBP') {
          let best = null, bestQ = null, minBytes = Infinity, lo = 1, hi = 100;
          while (lo <= hi) {
            const q = (lo + hi) >> 1;
            const v = mod.encode(pixels, width, height, Object.assign({}, WEBP_BASE, { quality: q }));
            steps++; stepProg(steps, 8);
            if (v && v.byteLength < minBytes) minBytes = v.byteLength;
            if (v && v.byteLength <= maxBytes) { best = new Uint8Array(v); bestQ = q; lo = q + 1; }
            else hi = q - 1;
          }
          if (!best) {
            self.postMessage({ jobId, type: 'done', fit: false, smallestBytes: minBytes, smallestKB: Math.ceil(minBytes / 1000), chroma: '420', steps, width, height });
            return;
          }
          self.postMessage({ jobId, type: 'done', fit: true, bytes: best.buffer, q: bestQ, chroma: '420', steps, width, height }, [best.buffer]);
          return;
        }

        throw new Error('Unsupported format: ' + fmt);
      } catch (err) {
        self.postMessage({ jobId, type: 'error', message: String(err && err.message || err) });
      }
    };
  `;

  let workerBlobUrl = null;
  let created = 0, nextJobId = 1;
  const idle = [], queue = [];
  const canWorkerDecode = typeof OffscreenCanvas !== 'undefined';

  async function decodeOnMain(pngU8, paintWhite) {
    const url = URL.createObjectURL(new Blob([pngU8], { type: 'image/png' }));
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      if (paintWhite) { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height); }
      ctx.drawImage(img, 0, 0);
      const d = ctx.getImageData(0, 0, c.width, c.height).data;

    // ---------- image export ----------
    let imgResults = [], imgErrors = [], imgChosen = [];

    function startImages() {

    async function loadImg(blob) {
      const url = URL.createObjectURL(blob);
      try {
        const img = new Image();
        img.src = url;
        await img.decode();
        return img;
      } finally {
        URL.revokeObjectURL(url);
      }
    }
    async function pngIndexed256(pngU8) {
      const img = await loadImg(new Blob([pngU8], { type: 'image/png' }));
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const rgba = ctx.getImageData(0, 0, c.width, c.height).data;
      return new Blob([UPNG.encode([rgba.buffer], c.width, c.height, 256)], { type: 'image/png' });
    }

    async function processImage(r, settings, skip, onStep) {
      const fmt = settings.format;
      const pngU8 = r.bytes instanceof Uint8Array ? r.bytes : new Uint8Array(r.bytes);
      if (fmt === 'PNG') {
        if (skip) return { fit: true, blob: new Blob([pngU8], { type: 'image/png' }), q: null };
        return { fit: true, blob: await pngIndexed256(pngU8), q: null };
      }
      const res = await window.CEStillEncoder.encodeStill({ fmt, kb: settings.kb, skip, pngBytes: pngU8 }, onStep);
      if (!res.fit) return { fit: false, smallestKB: res.smallestKB };
      const mime = fmt === 'JPG' ? 'image/jpeg' : 'image/webp';
      return { fit: true, blob: new Blob([res.bytes], { type: mime }), q: res.q };
    }

    async function finishImages() {
      const skip = $('skipOpt').checked;
      const totalItems = imgResults.length;
      const slots = new Array(totalItems);
      const itemProg = new Float32Array(totalItems);
      let completed = 0;

      const updateUiProgress = () => {
        if (!totalItems) return;
        const activeIdx = Math.min(totalItems, completed + 1);
        $('imgStatus').textContent = `Optimising ${activeIdx} of ${totalItems}…`;
        let sum = 0;
        for (let i = 0; i < totalItems; i++) sum += itemProg[i];
        $('imgBar').firstElementChild.style.width = `${Math.round(20 + 80 * (sum / totalItems))}%`;
      };
      updateUiProgress();

      await Promise.all(imgResults.map(async (r, k) => {
        const settings = imgChosen.find((c) => c.id === r.id) || { format: r.format || 'JPG', kb: defaults.kb };
        try {
          const res = await processImage(r, settings, skip, (p) => { itemProg[k] = p; updateUiProgress(); });
          slots[k] = { r, settings, res };
        } catch (e) {
          slots[k] = { r, settings, err: e.message || String(e) };
        } finally {

          completed++;
          updateUiProgress();
        }
      }));

      let cantFitCount = 0, lowQCount = 0;

        const s = slots[k];
        if (!s) continue;

        const { r, settings, res } = s;
        if (!res.fit) {

          continue;

        outs.push({ id: r.id, name: `${r.name}.${settings.format.toLowerCase()}`, blob: res.blob });
        if (!skip && res.q != null && res.q < 50) {
          lowQCount++;
          notes.push(`${r.name}: Low quality (q${res.q}). Fits ${settings.kb} KB, but check it before sending.`);
        }
      }

      let blob = null, filename = '';
      if (outs.length === 1) { blob = outs[0].blob; filename = outs[0].name; }
      else if (outs.length > 1) {
        const zip = new JSZip(), used = {};
        outs.forEach((o) => { let n = o.name; used[n] = (used[n] || 0) + 1; if (used[n] > 1) n = n.replace(/(\.\w+)$/, `-${used[n]}$1`); zip.file(n, o.blob); });
        blob = await zip.generateAsync({ type: 'blob' });
        filename = `${projectName}-images-${stamp()}.zip`;

      if (blob && !allMode) saveWhenVisible(blob, filename);
      outs.forEach((o) => exported.images.add(o.id));
      busy = false; done.images = outs.length > 0 && !cantFitCount && !imgErrors.length;
      $('imgBar').hidden = true; $('imgStatus').textContent = '';

      const total = outs.reduce((a, o) => a + o.blob.size, 0);
      const hasWarn = cantFitCount > 0 || lowQCount > 0 || imgErrors.length > 0;
      let headline;
      if (outs.length > 0) {
        const parts = [`${plural(outs.length, 'image')} exported`];

    // ---------- video export ----------
    let vQueue = Promise.resolve(), vOut = [], vErrors = [], vTotal = 0, vSetting = '', vLogs = [], vRendered = 0, vRenderFps = 0, vTargetFps = 24, vTargetQ = 'MEDIUM', vFormat = 'MP4', vLoop = 0, renderTimer = null;

    async function finalizeVideo() {

        blob, filename, details: lines.join('\n')
      });

    }

    // ---------- messages from Figma ----------
    window.onmessage = ({ data: { pluginMessage: msg } = {} }) => {
      if (!msg) return;

        renderAll();
      }

        $('imgBar').firstElementChild.style.width = `${Math.round(20 * imgResults.length / Math.max(1, imgChosen.length))}%`;
        $('imgStatus').textContent = `Exported ${imgResults.length} of ${imgChosen.length} from Figma…`;

        tick(); renderTimer = setInterval(tick, 1000);
      }
      if (msg.type === 'video-error') { stopRenderTimer(); vErrors.push(`${msg.data.name}: ${msg.data.message}`); }
      if (msg.type === 'video-result') {
        stopRenderTimer();
        const { id, name, bytes, used, settingErrors, fps, renderFps, renderLog } = msg.data;
        if (renderFps) vRenderFps = renderFps;
        if (renderLog) vLogs.push(...renderLog);
        if (used) vSetting = used;
        if (settingErrors && settingErrors.length) console.log('[CompressExpress Motion] Figma export setting errors', settingErrors);
        vQueue = vQueue.then(async () => {
          if (vFormat !== 'MP4') {
            vOut.push({ id, name, bytes: new Uint8Array(bytes), fixed: false, retimed: false, engine: 'none', mode: 'none', fixMs: 0 });
            $('vidBar').firstElementChild.style.width = `${Math.round(100 * (vOut.length + vErrors.length) / vTotal)}%`;
            return;
          }
          try {
            const r = await fixRotation(new Uint8Array(bytes),
              (p) => { $('vidStatus').textContent = `Fixing ${name}… ${Math.round(p * 100)}%`; $('vidBar').firstElementChild.style.width = `${Math.round(100 * (vOut.length + vErrors.length + p) / vTotal)}%`; },
              (st) => { $('vidStatus').textContent = `${name}: ${st}`; },
              fps, vTargetQ);
            vOut.push({ id, name, bytes: r.bytes, fixed: r.fixed, retimed: r.retimed, engine: r.engine, mode: r.mode, fixMs: r.fixMs });
          } catch (e) { vErrors.push(`${name}: ${e.message}`); }
          $('vidBar').firstElementChild.style.width = `${Math.round(100 * (vOut.length + vErrors.length) / vTotal)}%`;
        });
      }
      if (msg.type === 'video-complete') vQueue = vQueue.then(finalizeVideo);
    };

    syncFormat();
    renderAll();
    window.addEventListener('load', () => toFigma({ type: 'get-images' }));
  })();
  </script>
</body>
</html>
